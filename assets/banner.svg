<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="solve-everything: LLM + code for every modality. Better input, better output.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b2340"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64748b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#dots)"/>

  <text x="64" y="118" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" font-size="62" font-weight="700" fill="#f8fafc">solve-<tspan fill="url(#accent)">everything</tspan></text>
  <text x="66" y="170" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" fill="#e2e8f0">用 LLM + 代码，解决所有模态的所有问题</text>
  <text x="66" y="210" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Better input, better output · 更好的输入，才有更好的输出</text>

  <!-- modality chips -->
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">
    <!-- audio -->
    <g transform="translate(64,262)">
      <rect width="72" height="72" rx="14" fill="#111827" stroke="#334155"/>
      <polyline points="12,36 20,36 24,22 30,52 36,16 42,56 48,28 54,44 60,36" fill="none" stroke="#fb923c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="36" y="96">音频</text>
    </g>
    <!-- video -->
    <g transform="translate(152,262)">
      <rect width="72" height="72" rx="14" fill="#111827" stroke="#334155"/>
      <rect x="14" y="20" width="44" height="32" rx="4" fill="none" stroke="#f472b6" stroke-width="3"/>
      <path d="M31 28 L43 36 L31 44 Z" fill="#f472b6"/>
      <text x="36" y="96">视频</text>
    </g>
    <!-- screen -->
    <g transform="translate(240,262)">
      <rect width="72" height="72" rx="14" fill="#111827" stroke="#334155"/>
      <rect x="12" y="16" width="48" height="32" rx="3" fill="none" stroke="#c084fc" stroke-width="3"/>
      <line x1="36" y1="48" x2="36" y2="56" stroke="#c084fc" stroke-width="3"/>
      <line x1="26" y1="57" x2="46" y2="57" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
      <line x1="19" y1="26" x2="45" y2="26" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="19" y1="34" x2="38" y2="34" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
      <text x="36" y="96">屏幕</text>
    </g>
    <!-- document -->
    <g transform="translate(328,262)">
      <rect width="72" height="72" rx="14" fill="#111827" stroke="#334155"/>
      <path d="M22 12 H42 L52 22 V60 H22 Z" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linejoin="round"/>
      <path d="M42 12 V22 H52" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linejoin="round"/>
      <line x1="28" y1="32" x2="46" y2="32" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="28" y1="40" x2="46" y2="40" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="28" y1="48" x2="40" y2="48" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
      <text x="36" y="96">文档</text>
    </g>
    <!-- music -->
    <g transform="translate(416,262)">
      <rect width="72" height="72" rx="14" fill="#111827" stroke="#334155"/>
      <circle cx="28" cy="50" r="7" fill="#818cf8"/>
      <line x1="35" y1="50" x2="35" y2="18" stroke="#818cf8" stroke-width="3"/>
      <path d="M35 18 Q46 22 50 32" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
      <text x="36" y="96">音乐</text>
    </g>
  </g>

  <!-- flow arrow -->
  <rect x="508" y="294" width="120" height="8" rx="4" fill="url(#flow)"/>
  <path d="M628 286 L646 298 L628 310 Z" fill="#f472b6"/>
  <text x="568" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">code perceives</text>

  <!-- timeline -->
  <g transform="translate(664,262)">
    <rect width="250" height="72" rx="14" fill="#111827" stroke="#334155"/>
    <rect x="14" y="14" width="66" height="10" rx="5" fill="#4e79a7"/>
    <rect x="128" y="14" width="44" height="10" rx="5" fill="#4e79a7"/>
    <rect x="84" y="31" width="40" height="10" rx="5" fill="#f28e2b"/>
    <rect x="176" y="31" width="60" height="10" rx="5" fill="#59a14f"/>
    <rect x="14" y="48" width="104" height="10" rx="3" fill="#cdd9f0" fill-opacity="0.55"/>
    <rect x="122" y="48" width="114" height="10" rx="3" fill="#e0d2f0" fill-opacity="0.55"/>
    <text x="125" y="96" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">盘点 · 互证 · 对账 100%</text>
  </g>

  <rect x="930" y="294" width="110" height="8" rx="4" fill="url(#flow)"/>
  <path d="M1040 286 L1058 298 L1040 310 Z" fill="#f472b6"/>
  <text x="985" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">LLM understands</text>

  <!-- output -->
  <g transform="translate(1076,262)">
    <rect width="140" height="72" rx="14" fill="#111827" stroke="url(#accent)" stroke-width="2"/>
    <line x1="18" y1="20" x2="96" y2="20" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <line x1="18" y1="36" x2="80" y2="36" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="50" x2="70" y2="50" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M100 42 L110 52 L126 32" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="96" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">输出 · 交接 · 决策</text>
  </g>
</svg>
